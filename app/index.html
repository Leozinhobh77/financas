<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Finanças</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="topo">
  <div class="topo-logo">Finan<span>ças</span></div>
  <nav class="topo-nav" id="navDesktop" aria-label="Navegação principal"></nav>
  <div class="topo-acoes">
    <button class="icon-btn" id="btnConfig" type="button" aria-label="Ajustes"></button>
    <button class="icon-btn" id="btnTema" type="button" aria-label="Alternar tema"></button>
  </div>
</header>

<main id="conteudo"></main>

<button class="fab" id="btnNovaConta" type="button" aria-label="Nova conta"></button>

<nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>

<!-- Modal: criar / editar conta -->
<div class="modal-camada" id="camadaModal" hidden>
  <div class="modal-fundo" id="modalFundo"></div>
  <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modalContaTitulo">
    <div class="modal-cabeca">
      <h2 id="modalContaTitulo">Nova conta</h2>
      <button class="icon-btn" id="fecharModalConta" type="button" aria-label="Fechar"></button>
    </div>
    <form id="formConta" class="form-conta" novalidate>
      <div class="campo">
        <span class="rotulo">Tipo</span>
        <div class="segmentado" id="segTipo" role="radiogroup" aria-label="Tipo de conta">
          <button type="button" class="seg-opcao" data-valor="pagar">A pagar</button>
          <button type="button" class="seg-opcao" data-valor="receber">A receber</button>
        </div>
      </div>

      <label class="campo">
        <span class="rotulo">Descrição</span>
        <input type="text" id="fDescricao" required placeholder="Ex.: Água, Aluguel, Salário...">
      </label>

      <div class="campo-linha">
        <label class="campo">
          <span class="rotulo">Valor</span>
          <input type="number" id="fValor" required min="0.01" step="0.01" inputmode="decimal" placeholder="0,00">
        </label>
        <label class="campo">
          <span class="rotulo">Vencimento</span>
          <input type="date" id="fVencimento" required>
        </label>
      </div>

      <label class="campo">
        <span class="rotulo">Categoria</span>
        <select id="fCategoria"></select>
      </label>
      <label class="campo" id="campoNovaCategoria" hidden>
        <span class="rotulo">Nome da nova categoria</span>
        <input type="text" id="fNovaCategoria" placeholder="Ex.: educação">
      </label>

      <div class="campo">
        <span class="rotulo">Repetição</span>
        <div class="segmentado" id="segModo" role="radiogroup" aria-label="Modo de repetição">
          <button type="button" class="seg-opcao" data-valor="avulsa">Avulsa</button>
          <button type="button" class="seg-opcao" data-valor="recorrente">Recorrente</button>
          <button type="button" class="seg-opcao" data-valor="parcelada">Parcelada</button>
        </div>
      </div>

      <p class="dica" id="dicaRecorrente" hidden>
        Fica <strong>só neste mês</strong>. A próxima ocorrência (mesmo dia, mês seguinte) só é
        criada quando você marcar esta como paga.
      </p>

      <label class="campo" id="campoParcelas" hidden>
        <span class="rotulo">Quantidade de parcelas</span>
        <input type="number" id="fParcelas" min="1" max="60" step="1" value="2">
      </label>
      <p class="dica" id="dicaParcelada" hidden>
        Cria <strong>todas as parcelas de uma vez</strong>, uma por mês a partir do vencimento acima.
      </p>

      <label class="campo">
        <span class="rotulo">Notas <em>(opcional)</em></span>
        <textarea id="fNotas" rows="2" placeholder="Qualquer observação..."></textarea>
      </label>

      <div class="form-acoes">
        <button type="button" class="botao botao-fantasma" id="cancelarModalConta">Cancelar</button>
        <button type="submit" class="botao botao-principal" id="salvarModalConta">Salvar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: marcar como paga (com data escolhível) -->
<div class="modal-camada" id="camadaPagar" hidden>
  <div class="modal-fundo" id="pagarFundo"></div>
  <div class="modal-caixa modal-caixa--pequena" role="dialog" aria-modal="true" aria-labelledby="pagarTitulo">
    <h2 id="pagarTitulo">Marcar como paga</h2>
    <p><strong id="pagarDescricao"></strong> · <span id="pagarValor" class="num"></span></p>
    <label class="campo">
      <span class="rotulo">Quando você pagou?</span>
      <input type="date" id="fPagoEm">
    </label>
    <p class="dica" id="pagarAvisoRecorrente" hidden></p>
    <div class="form-acoes">
      <button type="button" class="botao botao-fantasma" id="pagarCancelar">Cancelar</button>
      <button type="button" class="botao botao-principal" id="pagarConfirmar">Confirmar pagamento</button>
    </div>
  </div>
</div>

<!-- Modal: confirmação genérica -->
<div class="modal-camada" id="camadaConfirm" hidden>
  <div class="modal-fundo" id="confirmFundo"></div>
  <div class="modal-caixa modal-caixa--pequena" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitulo">
    <h2 id="confirmTitulo">Confirmar</h2>
    <p id="confirmTexto"></p>
    <div class="form-acoes" id="confirmBotoes"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/datas.js"></script>
<script src="js/contas.js"></script>
<script src="js/categorias.js"></script>
<script src="js/filtros.js"></script>
<script src="js/analise.js"></script>
<script src="js/armazenamento.js"></script>
<script src="js/formatar.js"></script>
<script src="js/icones.js"></script>
<script src="js/graficos.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
